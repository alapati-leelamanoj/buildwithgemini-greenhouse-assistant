<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Greenhouse Assistant</title>
<!-- Optional: used only to draw A2UI Icon components. If it can't load (offline/
     corp network), icons fall back to showing their name as text. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<style>
  :root { 
    --accent:#2e7d32; 
    --accent-dark:#1b5e20;
    --accent-light:#e8f5e9;
    --accent-hover:#c8e6c9;
    --bg:#f4f7f4; 
    --border:#d0ded1; 
    --text-primary:#1c2d1e;
    --text-secondary:#5a6e5b;
  }
  * { box-sizing:border-box; }
  body { 
    margin:0; 
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; 
    background:var(--bg); 
    display:flex; 
    flex-direction:column; 
    height:100vh; 
    color:var(--text-primary);
  }
  header { 
    background:linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%); 
    color:#fff; 
    padding:1rem 1.4rem; 
    font-weight:700; 
    font-size:1.2rem; 
    display:flex; 
    align-items:center; 
    gap:.6rem; 
    box-shadow:0 2px 8px rgba(0,0,0,.12); 
    letter-spacing:0.3px;
  }
  header span.status-dot {
    width:8px; height:8px; background:#81c784; border-radius:50%; margin-left:auto; display:inline-block; box-shadow:0 0 6px #81c784;
  }
  #log { 
    flex:1; 
    overflow-y:auto; 
    padding:1.4rem 1.2rem; 
    max-width:820px; 
    width:100%; 
    margin:0 auto; 
    display:flex;
    flex-direction:column;
    gap:1rem;
  }
  .msg-row { 
    display:flex; 
    gap:.65rem; 
    align-items:flex-start; 
    width:100%;
  }
  .msg-row.user { 
    flex-direction:row-reverse; 
  }
  .avatar {
    width:36px; 
    height:36px; 
    border-radius:50%; 
    display:flex; 
    align-items:center; 
    justify-content:center; 
    font-size:1.15rem; 
    flex-shrink:0; 
    background:#fff;
    border:1px solid var(--border);
    box-shadow:0 1px 3px rgba(0,0,0,.06);
  }
  .msg-row.user .avatar {
    background:var(--accent-light);
    border-color:var(--accent);
  }
  .msg-content {
    display:flex;
    flex-direction:column;
    max-width:85%;
  }
  .msg-row.user .msg-content {
    align-items:flex-end;
  }
  .sender-name {
    font-size:0.75rem;
    font-weight:600;
    margin-bottom:0.25rem;
    color:var(--text-secondary);
  }
  .bubble { 
    display:inline-block; 
    padding:.75rem 1.05rem; 
    border-radius:16px; 
    background:#fff; 
    border:1px solid var(--border); 
    text-align:left; 
    line-height:1.45;
    box-shadow:0 1px 4px rgba(46,125,50,.06);
    white-space:pre-wrap; 
    font-size:0.95rem;
  }
  .msg-row.agent .bubble {
    border-top-left-radius:4px;
  }
  .msg-row.user .bubble { 
    background:linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%); 
    color:#fff; 
    border:none; 
    border-top-right-radius:4px;
    box-shadow:0 2px 6px rgba(46,125,50,.25);
  }
  /* When the reply is an A2UI card, drop bubble chrome so the card stands alone with elevation */
  .bubble.rich { 
    background:transparent; 
    border:none; 
    padding:0; 
    box-shadow:none;
    max-width:100%; 
    white-space:normal; 
    width:100%;
  }
  form { 
    display:flex; 
    gap:.6rem; 
    padding:1rem 1.4rem; 
    border-top:1px solid var(--border); 
    background:#fff; 
    max-width:820px;
    width:100%;
    margin:0 auto;
  }
  .form-container {
    background:#fff;
    border-top:1px solid var(--border);
    box-shadow:0 -2px 8px rgba(0,0,0,.03);
  }
  input { 
    flex:1; 
    padding:.75rem 1rem; 
    border:1.5px solid var(--border); 
    border-radius:24px; 
    font-size:0.95rem; 
    outline:none;
    transition:border-color .2s, box-shadow .2s;
  }
  input:focus {
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(46,125,50,.15);
  }
  button.send-btn { 
    padding:.75rem 1.3rem; 
    border:none; 
    border-radius:24px; 
    background:linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%); 
    color:#fff; 
    font-weight:600; 
    cursor:pointer; 
    transition:transform .1s, opacity .15s;
    display:flex;
    align-items:center;
    gap:0.3rem;
  }
  button.send-btn:hover { opacity:0.92; }
  button.send-btn:active { transform:scale(0.97); }

  /* Prompt chips row */
  #prompts { 
    display:flex; 
    gap:.55rem; 
    padding:.65rem 1.4rem; 
    background:rgba(255,255,255,.8); 
    border-top:1px solid var(--border); 
    overflow-x:auto; 
    max-width:820px;
    width:100%;
    margin:0 auto;
  }
  .prompt-btn { 
    border:1px solid var(--accent); 
    background:var(--accent-light); 
    color:var(--accent-dark); 
    border-radius:20px; 
    padding:.45rem .9rem; 
    font-size:.85rem; 
    font-weight:500; 
    cursor:pointer; 
    white-space:nowrap; 
    transition:all .15s ease; 
    box-shadow:0 1px 3px rgba(46,125,50,.08);
  }
  .prompt-btn:hover { 
    background:var(--accent-hover); 
    transform:translateY(-1px);
    box-shadow:0 2px 5px rgba(46,125,50,.15);
  }

  /* --- A2UI component styles (Card, Column, Row, Text, Divider, List, Image, Icon) --- */
  .a2card { 
    border:1px solid var(--border); 
    border-radius:14px; 
    padding:1.1rem; 
    background:#fff; 
    box-shadow:0 2px 8px rgba(46,125,50,.07); 
    max-width:100%; 
    transition:box-shadow .2s;
  }
  .a2card:hover {
    box-shadow:0 4px 12px rgba(46,125,50,.12);
  }
  .a2card + .a2card, .a2col > .a2card { margin-top:.7rem; }
  .a2col { display:flex; flex-direction:column; gap:.5rem; }
  .a2row { display:flex; flex-direction:row; gap:.65rem; align-items:center; flex-wrap:wrap; }
  .a2row.between { justify-content:space-between; }
  .a2text { margin:0; line-height:1.45; }
  .a2text.a2-h1 { font-size:1.55rem; font-weight:700; color:var(--accent-dark); }
  .a2text.a2-h2 { font-size:1.3rem; font-weight:700; color:var(--accent-dark); }
  .a2text.a2-h3 { font-size:1.15rem; font-weight:600; color:var(--accent); }
  .a2text.a2-h4 { font-size:1.02rem; font-weight:600; }
  .a2text.a2-caption { font-size:.85rem; color:var(--text-secondary); }
  .a2divider { border:none; border-top:1px solid var(--border); margin:.5rem 0; width:100%; }
  .a2img { max-width:100%; border-radius:10px; display:block; box-shadow:0 2px 6px rgba(0,0,0,.08); }
  .material-symbols-outlined { font-family:'Material Symbols Outlined'; font-size:1.3rem; line-height:1; vertical-align:middle; color:var(--accent); }
</style>
</head>
<body>
<header>
  <span>🌿 Greenhouse Assistant</span>
  <span class="status-dot" title="Online"></span>
</header>

<div id="log"></div>

<div class="form-container">
  <div id="prompts">
    <button type="button" class="prompt-btn" data-prompt="Find pet-safe houseplants for low-light rooms">🐾 Pet-Safe Low-Light Plants</button>
    <button type="button" class="prompt-btn" data-prompt="Calculate a customized watering schedule for my Snake Plant in winter with a terra cotta pot">💧 Watering Schedule</button>
    <button type="button" class="prompt-btn" data-prompt="Calculate potting mix volume and drainage component ratios for five 6-inch pots">🪴 Soil Mix Calculator</button>
  </div>
  <form id="form">
    <input id="input" placeholder="Ask your botanical assistant anything…" autocomplete="off" autofocus>
    <button class="send-btn">Send</button>
  </form>
</div>



<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function bubble(who) {
  const row = el("div", "msg-row " + who);
  const avatar = el("div", "avatar", who === "user" ? "👤" : "🌿");
  const content = el("div", "msg-content");
  const sender = el("div", "sender-name", who === "user" ? "You" : "Greenhouse Concierge");
  const b = el("div", "bubble");
  
  content.appendChild(sender);
  content.appendChild(b);
  row.appendChild(avatar);
  row.appendChild(content);
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
  return b;
}


/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * Renders Card / Column / Row / Text / Divider / List / Image / Icon.
 * Anything else falls back to plain text (see renderReply). All text goes in via
 * textContent and image URLs are validated, so agent output can't inject HTML.
 * -------------------------------------------------------------------------- */

// A "bound value" is usually {literalString: "..."}; we only support literals.
function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

// child ids of a component's props: single `child` and/or `children.explicitList`.
function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

// A2UI icon names are camelCase (locationOn); Material Symbols wants snake_case.
function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;   // missing / cycle guard
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;   // only allow safe URLs
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || ""; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;   // unknown component -> skipped (text fallback covers content)
  }
}

// Render one or more A2UI messages (beginRendering + surfaceUpdate) into `container`.
// Returns true if anything was drawn.
function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {   // no valid root given -> infer un-referenced components
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

// Fallback: pull every Text value out of the messages as plain text.
function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";   // clear the "…" placeholder
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) b.appendChild(el("div", null, textStr));

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

// The proxy returns { parts: [{kind:"text",text} | {kind:"a2ui",data}] }.
form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  const b = bubble("agent"); b.textContent = "…";
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    // Read as text first, then parse. If the proxy ever returns a non-JSON error
    // page (e.g. a plain "Internal Server Error"), show that body instead of a
    // cryptic "Unexpected token" JSON error.
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
});

document.querySelectorAll(".prompt-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    input.value = btn.getAttribute("data-prompt");
    form.dispatchEvent(new Event("submit"));
  });
});
</script>
</body>
</html>
